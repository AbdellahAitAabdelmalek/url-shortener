name: url-shortener

services:
  app:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/url_shortener
      PUBLIC_BASE_URL: http://localhost:${APP_PORT:-4000}
    ports:
      - '${APP_PORT:-4000}:4000'
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: url_shortener
    ports:
      - '${DB_PORT:-5433}:5432'
    volumes:
      # Since PostgreSQL 18, the image stores its data in a versioned subdirectory of /var/lib/postgresql.
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d url_shortener']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
